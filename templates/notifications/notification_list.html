{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
  <h3>Notifications</h3>
  <a href="{% url 'notifications:mark_all_read' %}" class="btn btn-sm btn-outline-secondary">Mark all read</a>
</div>
<div class="list-group mt-3">
  {% for n in notifications %}
  <a href="{% url 'notifications:mark_read' n.pk %}" class="list-group-item list-group-item-action {% if not n.is_read %}fw-bold{% endif %}">
    {{ n.message }}
    <div class="small text-muted">{{ n.created_on|date:"d M Y H:i" }}</div>
  </a>
  {% empty %}
  <div class="list-group-item text-muted">No notifications.</div>
  {% endfor %}
</div>
{% endblock %}
