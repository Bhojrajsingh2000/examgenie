{% extends "base.html" %}
{% block title %}Payment Failed{% endblock %}
{% block content %}
<div class="card p-5 text-center" style="max-width:500px;margin:0 auto;">
  <h2 class="text-danger">✘ Payment Failed</h2>
  <p>Your payment for <strong>{{ payment.submission.subject }}</strong> could not be verified.</p>
  <a href="{% url 'payments:initiate_payment' payment.submission.pk %}" class="btn btn-primary mt-3">Try Again</a>
</div>
{% endblock %}
