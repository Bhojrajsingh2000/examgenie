{% extends "base.html" %}
{% block title %}Sections{% endblock %}
{% block content %}
<h3>Sections</h3>
<div class="row g-4 mt-2">
  <div class="col-md-4">
    <div class="card p-3">
      <h6>Add Section</h6>
      <form method="post">
        {% csrf_token %}
        <div class="mb-2">{{ form.school_class }}</div>
        <div class="mb-2">{{ form.name }}</div>
        <button class="btn btn-primary w-100">Add</button>
      </form>
    </div>
  </div>
  <div class="col-md-8">
    <table class="table bg-white">
      <thead><tr><th>Class</th><th>Section</th></tr></thead>
      <tbody>
        {% for s in sections %}
        <tr><td>{{ s.school_class }}</td><td>{{ s.name }}</td></tr>
        {% empty %}<tr><td colspan="2" class="text-muted">No sections yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
