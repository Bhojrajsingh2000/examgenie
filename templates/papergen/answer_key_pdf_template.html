<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 2cm; }
  body { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12pt; color: #111; }
  .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
  .header h1 { font-size: 16pt; margin: 0; color: #b02a37; }
  ol.questions { padding-left: 20px; }
  ol.questions li { margin-bottom: 10px; }
  .answer { color: #146c43; font-weight: bold; }
</style>
</head>
<body>
  <div class="header">
    <h1>ANSWER KEY (Confidential)</h1>
    <div>{{ subject.name }} — {{ blueprint.get_exam_type_display }} — Set {{ paper.set_label }}</div>
  </div>
  <ol class="questions">
    {% for pq in questions %}
    <li>
      {{ pq.question.question_text }}
      <div class="answer">Answer: {{ pq.question.answer }}</div>
    </li>
    {% endfor %}
  </ol>
</body>
</html>
